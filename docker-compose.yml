version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cybermaps-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cybermaps-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
