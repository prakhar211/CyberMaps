version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cybermaps-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cybermaps.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend:/app
      - cybermaps_data:/app/data
    networks:
      - cybermaps-net

  frontend:
    image: node:18-alpine
    container_name: cybermaps-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - cybermaps-net

volumes:
  cybermaps_data:

networks:
  cybermaps-net:
    driver: bridge
