services:
  - type: web
    name: cybermaps-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYBERMAPS_MODE
        value: playground
      - key: GOOGLE_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cybermaps-redis
          property: connectionString

  - type: redis
    name: cybermaps-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
